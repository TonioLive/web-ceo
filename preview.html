<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vista por dispositivos · [Nombre Apellido]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap">
<style>
/* Mesa de revisión oscura y neutra: la web es la protagonista en escritorio, tablet o móvil. */
:root{
  --bg:#141112; --panel:#1D191A; --line:#322B2C; --fg:#F1EBE4; --muted:#B3A7A1; --chip:#F1EBE4; --chip-fg:#141112; --device:#0A0909;
  --sans:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;overflow:hidden}
.bar{position:fixed;top:0;left:0;right:0;z-index:2;height:calc(56px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);padding-inline:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar__name{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--bg);flex:none}
.seg button{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background-color .25s,color .25s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--chip-fg)}
.seg button:focus-visible,.open:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.open{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 4px;color:var(--fg);text-decoration:none;font-size:12px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;flex:none}
.open:hover{text-decoration:underline;text-underline-offset:4px}
.stage{position:fixed;left:0;right:0;bottom:0;top:calc(56px + env(safe-area-inset-top,0px));overflow:hidden}
.device{position:absolute;left:50%;top:50%;box-sizing:content-box;transform-origin:50% 50%;transform:translate(-50%,-50%);background:var(--device)}
.device iframe{display:block;width:100%;height:100%;border:0;background:#F1EBE4}
.stage[data-mode="tablet"] .device{padding:18px;border-radius:40px;box-shadow:0 0 0 1px var(--line),0 40px 90px rgba(0,0,0,.55)}
.stage[data-mode="tablet"] iframe{border-radius:22px}
.stage[data-mode="mobile"] .device{padding:12px;border-radius:56px;box-shadow:0 0 0 1px var(--line),0 40px 90px rgba(0,0,0,.55)}
.stage[data-mode="mobile"] iframe{border-radius:44px}
.dims{position:fixed;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin:0;font-size:12px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
@media (max-width:720px){.bar__name{display:none}.seg .lbl{display:none}.seg button{padding:0 12px}}
@media (max-width:380px){.open .lbl{display:none}}
</style>
</head>
<body>
<header class="bar">
  <span class="bar__name">[N. Apellido] · Web</span>
  <div class="seg" role="group" aria-label="Ver la web en">
    <button type="button" data-mode="desktop" aria-pressed="true" aria-label="Escritorio"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1.2" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 14h5M8 11v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span class="lbl">Escritorio</span></button>
    <button type="button" data-mode="tablet" aria-pressed="false" aria-label="Tablet"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3" y="1.5" width="10" height="13" rx="1.6" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="12.3" r=".7" fill="currentColor"/></svg><span class="lbl">Tablet</span></button>
    <button type="button" data-mode="mobile" aria-pressed="false" aria-label="Móvil"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="4.5" y="1.5" width="7" height="13" rx="1.8" stroke="currentColor" stroke-width="1.3"/><path d="M7 3.4h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span class="lbl">Móvil</span></button>
  </div>
  <a class="open" href="./"><span class="lbl">Pantalla completa</span><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 11.5l7-7M6 4.5h5.5V10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</header>

<main class="stage" data-mode="desktop">
  <div class="device"><iframe id="site" src="./" title="Web de [Nombre Apellido]"></iframe></div>
</main>
<p class="dims" aria-live="polite"></p>

<script>
(function () {
  var stage = document.querySelector('.stage'), device = document.querySelector('.device'), dims = document.querySelector('.dims');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.seg button'));
  var SIZES = { tablet: [834, 1194, 18], mobile: [390, 844, 12] };
  var mode = 'desktop';
  try { var saved = localStorage.getItem('portfolio-preview-mode'); if (saved && (saved === 'desktop' || SIZES[saved])) mode = saved; } catch (e) {}

  function fit() {
    var sw = stage.clientWidth, sh = stage.clientHeight;
    if (mode === 'desktop') {
      var w = Math.max(sw, 1280), s = sw / w;
      device.style.width = w + 'px';
      device.style.height = (sh / s) + 'px';
      device.style.padding = '0';
      device.style.transform = 'translate(-50%,-50%)' + (s < 1 ? ' scale(' + s.toFixed(4) + ')' : '');
      dims.textContent = s < 1 ? w + ' px de ancho · vista reducida' : '';
      return;
    }
    var sz = SIZES[mode], pad = sz[2];
    device.style.width = sz[0] + 'px';
    device.style.height = sz[1] + 'px';
    device.style.padding = '';
    var s2 = Math.min((sw - 32) / (sz[0] + pad * 2), (sh - 48) / (sz[1] + pad * 2), 1);
    device.style.transform = 'translate(-50%,-50%) scale(' + s2.toFixed(4) + ')';
    dims.textContent = sz[0] + ' × ' + sz[1];
  }
  function setMode(m) {
    mode = m; stage.setAttribute('data-mode', m);
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-mode') === m ? 'true' : 'false'); });
    try { localStorage.setItem('portfolio-preview-mode', m); } catch (e) {}
    fit();
  }
  buttons.forEach(function (b) { b.addEventListener('click', function () { setMode(b.getAttribute('data-mode')); }); });
  window.addEventListener('resize', fit);
  setMode(mode);
})();
</script>
</body>
</html>
