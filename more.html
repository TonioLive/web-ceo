(function(){var h=document.documentElement;h.classList.add('js');
try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)h.classList.add('rm');
if(matchMedia('(hover: hover) and (pointer: fine)').matches)h.classList.add('fine');}catch(e){}})();

<script>
/* llegada en ascensor: prepara las puertas cerradas antes del primer pintado (ver assets/lift.js) */
(function(){try{var h=document.documentElement,s=sessionStorage,v=JSON.parse(s.getItem('lm-lift')||'null');if(!v)return;s.removeItem('lm-lift');
if(Date.now()-v.ts>8000||v.p!==location.pathname||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
var W=innerWidth,H=innerHeight,n=Math.abs(v.t-v.f),d=.25+n*.2,home=v.t===0&&!location.hash,st=h.style;
h.classList.add('lx-in');if(home)h.classList.add('lx-home');
st.setProperty('--lxz',(Math.max(W/(H*.43166),1.166)*1.08).toFixed(3));st.setProperty('--lxd',d.toFixed(2)+'s');
st.setProperty('--lxn','"'+v.f+'"');st.setProperty('--lxa',v.t>v.f?'"\u25B2"':v.t<v.f?'"\u25BC"':'""');
window.LM_LIFT={f:v.f,t:v.t,home:home,count:d,reveal:home?d+.3:d+.35,t0:performance.now()};}catch(e){}})();
</script>

/* Plantas en obras: detrás de las puertas del ascensor, la planta vacía con las cintas amarillas de Melara. */
.fl{position:relative;min-height:100vh;min-height:calc(var(--vh)*100);overflow:hidden;background:var(--white);display:flex;flex-direction:column;justify-content:space-between}
.fl__txt{position:relative;z-index:4;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);align-items:end;gap:28px clamp(32px,5vw,90px);padding:calc(108px + env(safe-area-inset-top,0px)) var(--gutter) 0}
.fl__floor{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.fl__floor b{display:grid;place-items:center;width:34px;height:34px;border:1px solid currentColor;border-radius:50%;font-size:15px;letter-spacing:0;font-weight:500}
.fl__title{font-weight:600;font-size:min(9.4vw,calc(var(--vh)*15),170px);line-height:.86;letter-spacing:-.012em;text-transform:uppercase}
.fl__title .ln{display:block;overflow:hidden;padding-bottom:.04em}
.fl__title .ln>span{display:block}
.fl__title .cur{font-style:italic}
.fl__side{display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:340px;padding-bottom:.6em;font-size:clamp(16px,1.4vw,20px);line-height:1.4}
.fl__soon{font-weight:500}
.fl__side .back{margin-top:12px}
.fl__stage{position:relative;z-index:3;width:100%;aspect-ratio:2400/1221;margin-top:calc(-1 * min(5vw,90px));pointer-events:none}
.fl__stage img{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:699px){

<script>
(function () {
  var LM = window.LM; if (!LM || !LM.motion) return;
  var G = LM.G, start = window.LM_LIFT ? window.LM_LIFT.reveal : 0.1;
  G.timeline({ delay: start })
    .from('.fl__floor', { autoAlpha: 0, y: 10, duration: 0.7, ease: 'power3.out' }, 0)
    .from('.fl__title .ln>span', { yPercent: 105, duration: 1.1, ease: 'power4.out', stagger: 0.1 }, 0.05)
    .from('.fl__side > *', { autoAlpha: 0, y: 14, duration: 0.8, ease: 'power3.out', stagger: 0.08 }, 0.35)
    .fromTo('.fl__tape--a', { clipPath: 'inset(0% 100% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.1, ease: 'power2.inOut', clearProps: 'clipPath' }, 0.3)
    .fromTo('.fl__tape--d', { clipPath: 'inset(0% 0% 0% 100%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.1, ease: 'power2.inOut', clearProps: 'clipPath' }, 0.55);
})();
</script>
