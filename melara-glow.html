(function(){var h=document.documentElement;h.classList.add('js');
try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)h.classList.add('rm');
if(matchMedia('(hover: hover) and (pointer: fine)').matches)h.classList.add('fine');}catch(e){}})();

<link rel="stylesheet" href="assets/site.css">
<style>
/* Melara Glow en obras: titular negro y las cintas amarillas cruzadas al pie. */
.mg{position:relative;min-height:100vh;min-height:calc(var(--vh)*100);overflow:hidden;background:var(--white);display:flex;flex-direction:column}
.mg__txt{position:relative;z-index:2;padding:calc(120px + env(safe-area-inset-top,0px)) var(--gutter) 0}
.mg__title{font-weight:600;font-size:min(9vw,150px);line-height:.86;letter-spacing:-.01em}
.mg__title span{display:block;overflow:hidden;padding-bottom:.04em}
.mg__title span i{display:block;font-style:normal}
.mg__tape{position:relative;z-index:1;margin-top:max(-16vw,-150px);width:100%;pointer-events:none}
.mg__tape img{width:100%;height:auto;mix-blend-mode:multiply}
.mg__back{position:absolute;z-index:3;right:var(--gutter);top:calc(84px + env(safe-area-inset-top,0px))}
@media (max-width:699px){.mg__tape{width:150%;margin-left:-8%}.mg__back{position:static;margin:20px var(--gutter) 0}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  var LM = window.LM; if (!LM || !LM.motion) return;
  var G = LM.G;
  G.timeline({ delay: 0.15 })
    .from('.mg__title i', { yPercent: 110, duration: 1.1, ease: 'power4.out', stagger: 0.09 }, 0)
    .fromTo('.mg__tape', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 1.5, ease: 'power3.inOut' }, 0.35)
    .from('.mg__tape img', { y: 40, rotation: -2, transformOrigin: '0% 100%', duration: 1.6, ease: 'power3.out' }, 0.35);
  if (LM.fine) {
    var ty = G.quickTo('.mg__tape img', 'y', { duration: 1.2, ease: 'power3.out' }), tr = G.quickTo('.mg__tape img', 'rotation', { duration: 1.2, ease: 'power3.out' });
    LM.$('.mg').addEventListener('mousemove', function (e) { var nx = e.clientX / window.innerWidth - 0.5, ny = e.clientY / window.innerHeight - 0.5; ty(ny * 14); tr(nx * 1.2); });
  }
})();
</script>
